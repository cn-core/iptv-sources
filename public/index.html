<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iptv</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
            line-height: 1.6;
            color: #24292f;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        #content {
            max-width: 1200px;
            margin: 20px auto;
            padding: 24px 32px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            margin-top: 0;
        }
        h2, h3, h4, h5, h6 {
            margin-top: 1.5em;
        }
        a {
            color: #0366d6;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        img {
            max-width: 100%;
            vertical-align: middle;
        }
        pre {
            background-color: #f8f8f8;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        code {
            background-color: #f8f8f8;
            padding: 2px 5px;
            border-radius: 3px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            position: sticky;
            top: 0;
            background-color: #f0f0f0;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        /* 放不下时才断行：优先在空格、标点处断开，表格始终不超出内容区 */
        td {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        @media (max-width: 768px) {
            #content {
                margin: 0;
                padding: 16px 12px;
                border-radius: 0;
                box-shadow: none;
            }
            th, td {
                padding: 6px;
            }
        }
    </style>
</head>
<body>
    <div id="content"></div>
    <script src="/index.js"></script>
</body>
</html>
